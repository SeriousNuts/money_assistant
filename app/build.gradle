apply plugin: 'com.android.application'
def demoSideBySide = project.hasProperty('demoSideBySide')
if (project.hasProperty('verificationApk') && !project.hasProperty('buildNumber')) {
    throw new GradleException('Use toolchains/build-tagged.sh; -PverificationApk no longer creates version numbers.')
}
def buildNumber = project.hasProperty('buildNumber') ? Integer.parseInt(project.property('buildNumber').toString()) : 0
if (buildNumber < 0 || buildNumber > 100000) throw new GradleException('Invalid buildNumber')
// A fresh clone can build and run the offline demo without private Firebase config.
if (!demoSideBySide && file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    compileSdkVersion 33
    buildToolsVersion '30.0.2'

    defaultConfig {
        applicationId demoSideBySide ? 'com.example.myapplication.preview' : 'com.example.myapplication'
        manifestPlaceholders = [appLabel: demoSideBySide ? 'Money Assistant (тест)' : 'Money Assistant']
        minSdkVersion 28
        targetSdkVersion 30
        versionCode buildNumber == 0 ? 6 : 12 + buildNumber
        versionName buildNumber == 0 ? '1.4.1' : "1.4.2-${buildNumber}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Preserve the original checkout for reference; only the rebuilt application is compiled.
    sourceSets {
        main.java.srcDirs = ['src/modern/java']
        main.res.srcDirs = ['src/modern/res']
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core:1.6.0'
    implementation 'com.google.firebase:firebase-auth:20.0.4'
    implementation 'com.google.firebase:firebase-firestore:22.1.2'
    // 4.2.0 targets Java 11; newer AARs use Java 17, unsupported by AGP 4.1.3.
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.2.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
}
