apply plugin: 'com.android.application'
def demoSideBySide = project.hasProperty('demoSideBySide')
def rustoreDistribution = project.hasProperty('rustoreDistribution')
if (project.hasProperty('verificationApk') && !project.hasProperty('buildNumber')) {
    throw new GradleException('Use toolchains/build-tagged.sh; -PverificationApk no longer creates version numbers.')
}
def buildNumber = project.hasProperty('buildNumber') ? Integer.parseInt(project.property('buildNumber').toString()) : 0
if (buildNumber < 0 || buildNumber > 100000) throw new GradleException('Invalid buildNumber')
def releaseSigning = project.hasProperty('releaseSigning')
if (releaseSigning && (demoSideBySide || buildNumber == 0))
    throw new GradleException('Store releases require a numbered full application build.')
def signingEnvironment = ['MONEY_RELEASE_STORE_FILE', 'MONEY_RELEASE_STORE_PASSWORD',
                          'MONEY_RELEASE_KEY_ALIAS', 'MONEY_RELEASE_KEY_PASSWORD']
if (releaseSigning && signingEnvironment.any { !System.getenv(it) })
    throw new GradleException('Set all MONEY_RELEASE_* environment variables for the owner-supplied signing key.')
// Firebase configuration is intentionally not applied while sign-in is disabled.

android {
    namespace 'com.example.myapplication'
    compileSdkVersion 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId demoSideBySide ? 'com.example.myapplication.preview' : 'com.example.myapplication'
        resValue 'string', 'default_online_ocr_provider', rustoreDistribution ? 'cloud' : 'gemini'
        manifestPlaceholders = [appLabel: demoSideBySide ? 'Money Assistant (тест)' : 'Money Assistant']
        minSdkVersion 28
        targetSdkVersion 36
        versionCode buildNumber == 0 ? 6 : 12 + buildNumber
        versionName buildNumber == 0 ? '1.4.1' : "1.4.2-${buildNumber}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Current application sources and resources live in src/modern.
    sourceSets {
        main.java.srcDirs = ['src/modern/java']
        main.res.srcDirs = ['src/modern/res']
    }

    signingConfigs {
        if (releaseSigning) {
            sharedStore {
                storeFile file(System.getenv('MONEY_RELEASE_STORE_FILE'))
                storePassword System.getenv('MONEY_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('MONEY_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('MONEY_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigning) signingConfig signingConfigs.sharedStore
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core:1.6.0'
    implementation 'com.google.firebase:firebase-auth:20.0.4'
    implementation 'com.google.firebase:firebase-firestore:22.1.2'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
}
